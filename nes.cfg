# NES Linker Configuration for cc65
# Memory layout for standard NROM mapper

MEMORY {
    # NROM has 32KB total (16KB PRG-ROM + 16KB expansion or 32KB PRG-ROM)
    # Using NROM-256 configuration (32KB PRG)

    HEADER: start = $0000, size = $0010, fill = yes, file = %O;

    # Zero Page RAM
    ZP:     start = $0000, size = $0100, type = rw, file = "";

    # System RAM
    RAM:    start = $0200, size = $0600, type = rw, file = "";

    # PRG-ROM (Program code)
    # NROM-256: $8000-$FFFF (32KB)
    ROM0:   start = $8000, size = $7FFA, fill = yes, file = %O;

    # Interrupt vectors
    VECTORS: start = $FFFA, size = $0006, fill = yes, file = %O;

    # CHR-ROM (Character/graphics data) - 8KB
    CHR:    start = $0000, size = $2000, fill = yes, file = %O;
}

SEGMENTS {
    HEADER:   load = HEADER,  type = ro;
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = RAM,     type = bss, define = yes;
    CODE:     load = ROM0,    type = ro,  define = yes;
    RODATA:   load = ROM0,    type = ro,  define = yes;
    DATA:     load = ROM0,    type = ro,  define = yes;
    VECTORS:  load = VECTORS, type = ro;
    CHARS:    load = CHR,     type = ro,  optional = yes;
}

FILES {
    %O: format = bin;
}
